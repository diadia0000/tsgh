[project]
name = "tsgh"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "valis-wsi>=1.2.0",
    "numpy<2",
    "cellpose",
    "segmentation-models-pytorch",
    "timm",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "albumentations",
    "opencv-contrib-python-headless<4.9",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "pandas>=2",
    "matplotlib",
    "tifffile",
    "imagecodecs",
    "pyvips",
    "ome-types",
    "aicspylibczi",
    "czifile",
    "dask",
    "tiler",
    "shapely",
    "geojson",
    "roifile",
    "tqdm",
    "pyyaml",
    "huggingface-hub",
    "einops",
    "ipykernel",
    "jupyter-client",
    "openpyxl",
    "natsort",
    "kornia",
    "openslide-python>=1.4.3",
    "pillow>=10",
    "openslide-bin>=4.0.0.13",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
]

[tool.uv]
override-dependencies = [
    "scikit-image>=0.22,<0.25",
    "numpy<2",
    "opencv-contrib-python-headless<4.9",
    "opencv-python-headless<4.9",
    "opencv-contrib-python<4.9",
    "opencv-python<4.9",
]

# Pin torch/torchvision to the CUDA 13.0 wheels (matches the validated venv:
# torch 2.11.0+cu130 / torchvision 0.26.0+cu130). explicit = true means this
# index is used ONLY for the packages mapped below; everything else stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

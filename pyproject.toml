[project]
name = "tsgh"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "valis-wsi",
    # numpy 2. The valis fork's current HEAD requires it outright
    # (`numpy>=2,<3; python_version >= '3.10'`), having flipped from the
    # `numpy<2` the previously locked commit declared. Verified 2026-07-27:
    # Valis.register() with this project's own config (DiskFD + LightGlue,
    # non-rigid off) runs clean on numpy 2.4.6 / opencv 4.13 / skimage 0.26.
    "numpy>=2,<3",
    "cellpose[gui]",
    "segmentation-models-pytorch",
    "timm",
    "dinov3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "albumentations",
    # valis HEAD also raised its floor to opencv >=4.10.
    "opencv-contrib-python-headless>=4.10,<5",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "pandas>=2",
    "matplotlib",
    "tifffile",
    "imagecodecs",
    "pyvips",
    "ome-types",
    "aicspylibczi",
    "czifile",
    "dask",
    "tiler",
    "shapely",
    "geojson",
    "roifile",
    "tqdm",
    "pyyaml",
    "huggingface-hub",
    "einops",
    "ipykernel",
    "jupyter-client",
    "openpyxl",
    "natsort",
    "kornia",
    "openslide-python>=1.4.3",
    "pillow>=10",
    "openslide-bin>=4.0.0.13",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
    # SimpleElastix build of SimpleITK: provides the same `SimpleITK` module
    # PLUS the Elastix API (GetDefaultParameterMap / ElastixImageFilter) that
    # valis non-rigid registration needs. Replaces the stock `simpleitk` wheel
    # (dropped via the override below). Only a prerelease wheel exists for
    # cp311/win_amd64; its version sorts below 3.0.0 so it still satisfies
    # valis-wsi's `simpleitk<3.0.0` constraint conceptually.
    "simpleitk-simpleelastix==3.0.0a1.post183",
    "python-multipart>=0.0.32",
    "tuspyserver>=4.2.12",
]

[tool.uv]
override-dependencies = [
    # The numpy<2 / opencv<4.9 / scikit-image<0.25 overrides that used to live
    # here are gone (2026-07-27). They existed only to hold the stack at the
    # numpy 1 era the old valis commit required; valis HEAD now requires the
    # opposite, and an override beats a package's own metadata, so leaving them
    # would have installed a numpy-2 valis on top of numpy 1. The whole
    # dependency set (179 packages, cellpose/smp/dinov3 included) resolves on
    # numpy 2 with CUDA torch intact.
    # Drop stock simpleitk (pulled transitively by valis-wsi). The marker never
    # matches, so no `simpleitk` requirement remains; the SimpleITK module is
    # instead provided by simpleitk-simpleelastix above. Without this, uv would
    # reinstall stock simpleitk and clobber the Elastix-enabled build.
    "simpleitk ; python_version < '3.0'",
]

# Pin torch/torchvision to the CUDA 13.0 wheels (matches the validated venv:
# torch 2.11.0+cu130 / torchvision 0.26.0+cu130). explicit = true means this
# index is used ONLY for the packages mapped below; everything else stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Fork of valis-wsi. Not published to PyPI, so it must come from git.
valis-wsi = { git = "https://github.com/diadia0000/valis.git" }
# dinov3 is not on PyPI. Pinned to the commit that was previously installed in
# the validated venv; without a rev, uv would float to the branch head.
dinov3 = { git = "https://github.com/facebookresearch/dinov3", rev = "346f38fee679c56a6888f91c51670fae61d364e0" }

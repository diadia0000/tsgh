# ============================================================
# Docker Compose for tsgh project
# ============================================================
# 使用方式：
#   建立映像：docker compose build
#   啟動容器：docker compose up -d
#   進入容器：docker compose exec tsgh bash
#   停止容器：docker compose down
# ============================================================

services:
  tsgh:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsgh-pytorch:latest
    container_name: tsgh-container
    
    # GPU 支援（需要 NVIDIA Container Toolkit）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 資料卷掛載（根據您的需求調整）
    volumes:
      # 掛載專案目錄（開發模式）
      - .:/app
      # 掛載資料目錄（如果需要）
      # - /path/to/your/data:/app/data
      # - /path/to/wsi/images:/app/wsi
    
    # 環境變數
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # 保持容器運行
    stdin_open: true
    tty: true
    
    # 工作目錄
    working_dir: /app
    
    # 預設命令
    command: /bin/bash

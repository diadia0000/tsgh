# ============================================================
# Docker Compose for tsgh project
# ============================================================
# 使用方式：
#   建立映像：docker compose build
#   啟動容器：docker compose up -d
#   進入容器：docker compose exec tsgh bash
#   停止容器：docker compose down
# ============================================================

services:
  tsgh:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsgh-pytorch:latest
    container_name: tsgh-container
    
    # GPU 支援（需要 NVIDIA Container Toolkit）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # 資料卷掛載（根據您的需求調整）
    volumes:
      # 掛載專案目錄（開發模式）
      - .:/app
      # CZI 上傳 / pipeline 輸出的儲存位置，先綁在 host 上原本用的路徑
      # (~/project/storge_tsgh，實際是 /data/nvmessd/storge_tsgh 的 symlink)
      - ${HOME}/project/storge_tsgh:/data/storge_tsgh

    # 環境變數
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # backend/schemas/alignment.py 的 STORAGE_DIR 讀這個，對應上面的掛載點
      - TSGH_STORAGE_DIR=/data/storge_tsgh
      # backend/main.py 讀這個；容器內一定要 0.0.0.0，127.0.0.1 從外面連不到
      - TSGH_HOST=0.0.0.0

    # 讓 host 能連到容器內跑起來的後端（backend/main.py 監聽 8000）
    ports:
      - "8000:8000"

    # 保持容器運行
    stdin_open: true
    tty: true
    
    # 工作目錄
    working_dir: /app
    
    # 預設命令
    command: /bin/bash

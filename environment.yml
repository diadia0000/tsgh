# Conda env that runs the Windows UI + native imaging stack (openslide / libvips).
# Reverse-engineered from the working `tsgh311` env on 2026-07-12.
#
# This is the NATIVE layer only (Python interpreter + openslide/pyvips/nodejs,
# all from conda-forge so the DLLs are handled for you). The Python ML/web stack
# (torch, cellpose, valis, fastapi, ...) is a pip layer installed on top -- see
# requirements-tsgh311.txt and docs/UI/12-env-setup.md.
#
# NOTE: this is a DIFFERENT environment from the Linux `.venv` + uv workflow that
# pyproject.toml / uv.lock / docs/UI/02 describe (that one pins torch cu130 for an
# RTX 5090). Do not `uv sync` into this env. See docs/UI/12 for why.
#
#   conda env create -f environment.yml
#   conda activate tsgh311
#   pip install -r requirements-tsgh311.txt
name: tsgh311
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # native imaging stack -- must come from conda-forge (bundles the DLLs);
  # pip-installing these on Windows is painful, which is the whole reason for conda.
  - openslide=4.0.1
  - openslide-python=1.4.6
  - libvips=8.18.4
  - pyvips=3.1.1
  # Node/npm for the Vite frontend; conda-forge installs them at the ENV ROOT
  # (not Scripts\), so PATH needs the env root prepended -- see docs/UI/11 §3.
  - nodejs=26.4.0
